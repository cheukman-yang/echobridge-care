<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'BIZ UDPGothic','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP',sans-serif">
  <title>EchoBridge アーキテクチャ</title>
  <desc>本人と相手のブラウザがCloud Runの通話サーバーにWebSocketでつながり、Speech-to-Text、Vertex AIのGemini、Text-to-Speechを使う。AIの案は本人が確定するまで相手に届かない。相手に読み上げられるのは、本人が選んで確定した文と、発信前に確かめたあいさつ・返事を待ってもらう定型の案内だけ。</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c585c"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #1a2023; }
      .lead { font-size: 18px; fill: #4c585c; }
      .h { font-size: 21px; font-weight: 700; fill: #1a2023; }
      .sub { font-size: 15px; fill: #4c585c; }
      .item { font-size: 17px; font-weight: 700; fill: #1a2023; }
      .detail { font-size: 14px; fill: #4c585c; }
      .api { font-size: 19px; font-weight: 700; fill: #1a2023; }
      .run { font-size: 21px; font-weight: 700; fill: #00504f; }
      .note { font-size: 16px; font-weight: 700; fill: #00504f; }
      .step { font-size: 16px; fill: #1a2023; }
      .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .card { fill: #eceff0; }
      .flow { stroke: #4c585c; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text class="title" x="40" y="58">EchoBridge アーキテクチャ</text>
  <text class="lead" x="40" y="94">Web通話とAIの中継を Cloud Run の1サービスで行い、AIの案は本人が確定するまで相手に届けない</text>

  <!-- 本人のブラウザ -->
  <rect x="30" y="124" width="350" height="560" rx="16" fill="#ffffff" stroke="#9aa6a8" stroke-width="2"/>
  <text class="h" x="50" y="160">本人のブラウザ</text>
  <text class="sub" x="50" y="184">発話が難しい人（/）</text>
  <rect class="card" x="50" y="204" width="310" height="62" rx="10"/>
  <text class="item" x="66" y="231">相手の発言の字幕</text>
  <text class="detail" x="66" y="254">途中結果つき・希望すれば相手の声も聞ける</text>
  <rect class="card" x="50" y="278" width="310" height="62" rx="10"/>
  <text class="item" x="66" y="305">AIの返答候補（通常3つ）</text>
  <text class="detail" x="66" y="328">即答フレーズ・登録した文</text>
  <rect class="card" x="50" y="352" width="310" height="62" rx="10"/>
  <text class="item" x="66" y="379">入力 → AIで整える</text>
  <text class="detail" x="66" y="402">送る前に確認・編集できる</text>
  <rect class="card" x="50" y="426" width="310" height="62" rx="10"/>
  <text class="item" x="66" y="453">送った文の状態</text>
  <text class="detail" x="66" y="476">音声を作成中 → 相手の端末で再生済み</text>
  <rect class="card" x="50" y="500" width="310" height="62" rx="10"/>
  <text class="item" x="66" y="527">通話後の予定の下書き</text>
  <text class="detail" x="66" y="550">日時・場所を確認して直す</text>
  <rect x="50" y="584" width="310" height="84" rx="10" fill="#d9efed"/>
  <text class="note" x="66" y="612">本人が選んで確定した文だけが</text>
  <text class="note" x="66" y="636">相手に読み上げられる</text>
  <text class="detail" x="66" y="658">例外：確認済みのあいさつ・定型の案内</text>

  <!-- Google Cloud -->
  <rect x="440" y="124" width="720" height="560" rx="18" fill="#f7f9f9" stroke="#9aa6a8" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="h" x="464" y="160">Google Cloud</text>

  <rect x="470" y="178" width="660" height="190" rx="14" fill="#ffffff" stroke="#00696b" stroke-width="2.5"/>
  <text class="run" x="492" y="212">Cloud Run</text>
  <text class="sub" x="1108" y="212" text-anchor="end">asia-northeast1・1サービス・インスタンス1台</text>
  <rect class="card" x="492" y="228" width="300" height="56" rx="10"/>
  <text class="item" x="508" y="252">Next.js の画面</text>
  <text class="detail" x="508" y="274">/（本人）と /join（相手）</text>
  <rect class="card" x="808" y="228" width="300" height="56" rx="10"/>
  <text class="item" x="824" y="252">通話サーバー</text>
  <text class="detail" x="824" y="274">WebSocket /ws/call</text>
  <rect class="card" x="492" y="296" width="616" height="56" rx="10"/>
  <text class="item" x="508" y="320">通話ルーム：招待コードと席のトークンで通話を分ける</text>
  <text class="detail" x="508" y="342">状態はメモリだけ。会話の本文はログに残さない</text>

  <rect x="470" y="432" width="200" height="118" rx="14" fill="#ffffff" stroke="#9aa6a8" stroke-width="2"/>
  <text class="api" x="486" y="466">Speech-to-Text</text>
  <text class="detail" x="486" y="494">v1 ストリーミング</text>
  <text class="detail" x="486" y="518">ja-JP・途中結果つき</text>
  <rect x="700" y="432" width="200" height="118" rx="14" fill="#ffffff" stroke="#9aa6a8" stroke-width="2"/>
  <text class="api" x="716" y="466">Gemini</text>
  <text class="detail" x="716" y="494">Vertex AI（global）</text>
  <text class="detail" x="716" y="518">gemini-3.5-flash-lite</text>
  <rect x="930" y="432" width="200" height="118" rx="14" fill="#ffffff" stroke="#9aa6a8" stroke-width="2"/>
  <text class="api" x="946" y="466">Text-to-Speech</text>
  <text class="detail" x="946" y="494">Chirp 3: HD（女性・男性）</text>
  <text class="detail" x="946" y="518">文ごとに MP3</text>

  <line class="flow" x1="570" y1="372" x2="570" y2="428" marker-start="url(#head)" marker-end="url(#head)"/>
  <line class="flow" x1="800" y1="372" x2="800" y2="428" marker-start="url(#head)" marker-end="url(#head)"/>
  <line class="flow" x1="1030" y1="372" x2="1030" y2="428" marker-start="url(#head)" marker-end="url(#head)"/>
  <circle cx="544" cy="400" r="14" fill="#00696b"/><text class="num" x="544" y="405" text-anchor="middle">2</text>
  <circle cx="774" cy="400" r="14" fill="#00696b"/><text class="num" x="774" y="405" text-anchor="middle">3</text>
  <circle cx="1004" cy="400" r="14" fill="#00696b"/><text class="num" x="1004" y="405" text-anchor="middle">5</text>

  <rect x="470" y="584" width="320" height="80" rx="12" fill="#ffffff" stroke="#d3d9da" stroke-width="2"/>
  <text class="item" x="486" y="616">Artifact Registry</text>
  <text class="detail" x="486" y="640">コンテナイメージ</text>
  <rect x="810" y="584" width="320" height="80" rx="12" fill="#ffffff" stroke="#d3d9da" stroke-width="2"/>
  <text class="item" x="826" y="616">Cloud Logging</text>
  <text class="detail" x="826" y="640">件数・時間・AIの出所など（本文は出さない）</text>

  <!-- 相手のブラウザ -->
  <rect x="1220" y="124" width="350" height="560" rx="16" fill="#ffffff" stroke="#9aa6a8" stroke-width="2"/>
  <text class="h" x="1240" y="160">相手のブラウザ</text>
  <text class="sub" x="1240" y="184">受付・家族など（/join）</text>
  <rect class="card" x="1240" y="204" width="310" height="62" rx="10"/>
  <text class="item" x="1256" y="231">押して話す</text>
  <text class="detail" x="1256" y="254">マイク → 16kHzのPCMにして送る</text>
  <rect class="card" x="1240" y="278" width="310" height="62" rx="10"/>
  <text class="item" x="1256" y="305">字幕</text>
  <text class="detail" x="1256" y="328">本人の文と自分の発話</text>
  <rect class="card" x="1240" y="352" width="310" height="62" rx="10"/>
  <text class="item" x="1256" y="379">読み上げ</text>
  <text class="detail" x="1256" y="402">Googleの音声を番号の順に再生</text>
  <rect class="card" x="1240" y="426" width="310" height="62" rx="10"/>
  <text class="item" x="1256" y="453">再生の報告</text>
  <text class="detail" x="1256" y="476">始まり・終わりを本人の画面へ</text>
  <rect x="1240" y="584" width="310" height="84" rx="10" fill="#eceff0"/>
  <text class="item" x="1256" y="618">インストール・ログイン不要</text>
  <text class="detail" x="1256" y="644">招待リンクを開いて応答するだけ</text>

  <!-- ブラウザと Cloud Run の間（WebSocket） -->
  <line class="flow" x1="466" y1="250" x2="386" y2="250" marker-end="url(#head)"/>
  <line class="flow" x1="384" y1="320" x2="464" y2="320" marker-end="url(#head)"/>
  <circle cx="425" cy="250" r="14" fill="#00696b"/><text class="num" x="425" y="255" text-anchor="middle">3</text>
  <circle cx="425" cy="320" r="14" fill="#00696b"/><text class="num" x="425" y="325" text-anchor="middle">4</text>
  <line class="flow" x1="1216" y1="250" x2="1136" y2="250" marker-end="url(#head)"/>
  <line class="flow" x1="1134" y1="320" x2="1214" y2="320" marker-end="url(#head)"/>
  <circle cx="1175" cy="250" r="14" fill="#00696b"/><text class="num" x="1175" y="255" text-anchor="middle">1</text>
  <circle cx="1175" cy="320" r="14" fill="#00696b"/><text class="num" x="1175" y="325" text-anchor="middle">6</text>

  <!-- 通話後の予定 -->
  <line class="flow" x1="205" y1="688" x2="205" y2="712" marker-end="url(#head)"/>
  <circle cx="232" cy="700" r="14" fill="#00696b"/><text class="num" x="232" y="705" text-anchor="middle">7</text>
  <rect x="30" y="716" width="350" height="84" rx="14" fill="#ffffff" stroke="#9aa6a8" stroke-width="2"/>
  <text class="item" x="50" y="750">Google カレンダー・マップ</text>
  <text class="detail" x="50" y="774">URLで作成画面・検索を開く（APIキー不要）</text>

  <!-- 流れ -->
  <rect x="440" y="716" width="1130" height="164" rx="14" fill="#f3f5f5"/>
  <circle cx="474" cy="748" r="13" fill="#00696b"/><text class="num" x="474" y="753" text-anchor="middle">1</text>
  <text class="step" x="496" y="754">相手が「押して話す」で話す</text>
  <circle cx="474" cy="784" r="13" fill="#00696b"/><text class="num" x="474" y="789" text-anchor="middle">2</text>
  <text class="step" x="496" y="790">音声を文字にして、両方の画面に字幕を出す</text>
  <circle cx="474" cy="820" r="13" fill="#00696b"/><text class="num" x="474" y="825" text-anchor="middle">3</text>
  <text class="step" x="496" y="826">Geminiが返答候補を作る（通常3つ。本人の画面だけ）</text>
  <circle cx="474" cy="856" r="13" fill="#00696b"/><text class="num" x="474" y="861" text-anchor="middle">4</text>
  <text class="step" x="496" y="862">本人が候補・即答・入力から選んで確定する</text>
  <circle cx="1024" cy="748" r="13" fill="#00696b"/><text class="num" x="1024" y="753" text-anchor="middle">5</text>
  <text class="step" x="1046" y="754">確定した文を音声にする</text>
  <circle cx="1024" cy="784" r="13" fill="#00696b"/><text class="num" x="1024" y="789" text-anchor="middle">6</text>
  <text class="step" x="1046" y="790">相手の端末で読み上げ、再生を本人に報告する</text>
  <circle cx="1024" cy="820" r="13" fill="#00696b"/><text class="num" x="1024" y="825" text-anchor="middle">7</text>
  <text class="step" x="1046" y="826">通話後、Geminiの予定の下書きを本人が確かめる</text>
  <text class="note" x="1012" y="862">AIの結果か定型文かは、常に画面に表示する</text>
</svg>
